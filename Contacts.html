<!DOCTYPE html>
<html lang="ru">

<head>
    <title>Контакты</title>
    <meta charset="utf-8">
    <meta name="description" content="Форма обращения пользователей к Бурдину Артёму">
    <meta name="keywords" content="Бурдин Артем, контанкт, обращение, письмо, обратиться">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1509/1509974.png" type="image/x-icon">

    <style>
        .main-form {
            background-color: #2C2C33;
            padding: 30px;
            border-radius: 30px;
        }

        .form-title {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 5px solid #343440;
        }

        .from-wrapper-centroid {
            padding: 30px;
        }

        .form-group {
            margin-top: 16px;
        }

        .form-group input[type="text"],
        input[type="tel"],
        input[type="email"] {
            font-size: 12pt;
            height: 30px;
            border-radius: 20px;
            padding-left: 12px;
        }

        .form-group textarea {
            font-size: 12pt;
            border-radius: 20px;
            padding: 10px;
        }

        .form-group input[type="file"] {
            background-color: #343440;
            border-radius: 20px;
        }

        #subject {
            height: 30px;
            border-radius: 20px;
            background-color: white;
        }

        .button-wrapper {
            text-align: center;
        }

        #send {
            border-radius: 30px;
            height: 50px;
            width: 180px;
            font-size: large;
            color: white;
            background-color: #343440;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="logo">
            <h1>RocetDev</h1>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="./index.html">Главная</a></li>
                <li><a href="./Interests.html">Увлечения</a></li>
                <li><a href="./Contacts.html">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <!-- div нужен чтобы потом через CSS отцентроваль контент страницы -->
    <div class="content">
        <div class="content-wrapper">
            <h1>Бурдин Артём Александрович</h1>

            <!-- Форма для обращений пользователей -->

            <form class="main-form">
                <div class="form-wrapper-centroid">
                    <h2 class="form-title">Написать мне</h2>
                    <div class="form-fields">
                        <div class="form-group">
                            <label for="name">Ваше имя:</label><br>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Ваша почта:</label><br>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Ваш номер телефона:</label><br>
                            <input type="tel" id="phone" name="phone" pattern="^(\+7|8)\d{10}$"
                                placeholder="+71234567890" required>
                        </div>

                        <div class="form-group">
                            <label for="subject">Тема письма:</label>
                            <select id="subject" name="subject" required>
                                <option value="">Выберите тему</option>
                                <option value="project">Совместный проект</option>
                                <option value="friendship">Дружба</option>
                                <option value="offer">Предложения</option>
                                <option value="complaint">Жалоба</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Как к вам обращаться?</label><br>
                            <div class="radio-group">
                                <input type="radio" id="male" name="appeal" value="male" required>
                                <label for="male">Уважаемый</label>

                                <input type="radio" id="female" name="appeal" value="female" required>
                                <label for="female">Уважаемая</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="file">Прикрепить файл:</label>
                            <input type="file" id="file" name="file" accept=".pdf,.doc,.docx,.jpg,.png">
                        </div>

                        <div class="form-group">
                            <label for="message">Сообщение:</label><br>
                            <textarea id="message" name="message" rows="8" cols="50" required></textarea>
                        </div>

                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="agreement" name="agreement" required>
                            <label for="agreement">Вы соглашаетесь с обработкой ваших персональных данных</label>
                        </div>

                        <div class="form-group">
                            <div class="button-wrapper">
                                <button type="submit" id="send">Отправить письмо</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Мой Сайт. Все права защищены. Это мое личное сообщение которое я добавил для коммита.</p>
    </footer>
</body>

</html>
